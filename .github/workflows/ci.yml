name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@c92818085dff62e5e3aded10dc90efc13d85d3de # v0.6.167
    permissions:
      contents: read
    with:
      fetch-depth: 0
      python-version: '3.15.2'
      tools: zizmor@1.32.0
      tool-assets: .github/source-tools.json
