name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@5af6f6d2d7039ff332b02aec2482107ac4381cdf # v0.6.170
    permissions:
      contents: read
    with:
      fetch-depth: 0
      python-version: '3.15.2'
      tools: zizmor@1.32.0
      tool-assets: .github/source-tools.json
