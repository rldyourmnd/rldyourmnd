name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@9f6ddf89a0e18bf2d044044049e30fa4727d362b # v0.6.105
    permissions:
      contents: read
    with:
      fetch-depth: 0
      python-version: '3.15.2'
      tools: zizmor@1.32.0
      tool-assets: .github/source-tools.json
