name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@86d0117166c205c6b52c91e0f95c8deaf5a29137 # v0.6.59
    permissions:
      contents: read
    with:
      fetch-depth: 0
      python-version: '3.15.2'
      tools: zizmor@1.32.0
      tool-assets: .github/source-tools.json
