name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@534b2785b49d5d36d074902aa9eefcb5786d898a # v0.6.83
    permissions:
      contents: read
    with:
      fetch-depth: 0
      python-version: '3.15.2'
      tools: zizmor@1.32.0
      tool-assets: .github/source-tools.json
